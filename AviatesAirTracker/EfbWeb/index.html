<!DOCTYPE html>
<html lang="en" data-theme="aviates" data-mode="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0A0D17" />
<title>AviatesAir EFB</title>
<link rel="stylesheet" href="efb.css" />
<link rel="icon" href="favicon.svg" />
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<!-- ══ PAIRING GATE ══ -->
<div id="pairing" class="pairing hidden">
  <div class="pairing-card">
    <img class="brand-mark-img" src="logo-white.webp" alt="" />
    <h1>AviatesAir <span>EFB</span></h1>
    <p class="pairing-sub">Enter the 6-digit pairing code shown in the desktop app.</p>
    <div class="code-input" id="codeInput">
      <input inputmode="numeric" maxlength="1" /><input inputmode="numeric" maxlength="1" />
      <input inputmode="numeric" maxlength="1" /><input inputmode="numeric" maxlength="1" />
      <input inputmode="numeric" maxlength="1" /><input inputmode="numeric" maxlength="1" />
    </div>
    <p class="pairing-err" id="pairErr"></p>
    <button class="btn-primary" id="pairBtn">Connect Tablet</button>
  </div>
</div>

<!-- ══ DEVICE (its own OS) ══ -->
<div id="app" class="device hidden">

  <!-- OS menu bar -->
  <header class="menubar">
    <div class="mb-cluster mb-left">
      <span class="mb-date" id="mbDate">-- --- ----</span>
      <span class="mb-sep">/</span>
      <span class="mb-time" id="mbTime">--:--L  --:--Z</span>
    </div>

    <!-- compact live-flight readout, hidden until a session is active -->
    <button class="mb-flight hidden" id="mbFlight" title="Open Flight app">
      <span class="mb-cs" id="mbCs">—</span>
      <span class="mb-phase" id="mbPhase">STANDBY</span>
      <span class="mb-route" id="mbRoute">---- → ----</span>
    </button>

    <div class="mb-cluster mb-right">
      <span class="mb-ic" id="mbSim" title="Simulator link" data-state="off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.5 13 3l-2 4-5-1L2 9l5 2-1 3 4 1 1 5 5-3z" stroke-linejoin="round"/></svg>
      </span>
      <span class="mb-ic" id="mbAcars" title="ACARS link" data-state="off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20V10M12 10 7 6M12 10l5-4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 20h16" stroke-linecap="round"/></svg>
      </span>
      <span class="mb-batt"><i></i></span>
    </div>
  </header>

  <!-- HOME / launcher -->
  <div class="home" id="home">
    <div class="wallpaper" id="wallpaper"></div>
    <div class="wall-scrim"></div>

    <div class="app-launcher" id="appGrid"></div>

    <div class="brand-lockup" id="flightWidget" role="button" tabindex="0" title="Open Flight app">
      <img class="brand-logo" src="logo-white.webp" alt="" />
      <div class="brand-word">AVIATES<span>AIR</span></div>
      <div class="brand-sub">ELECTRONIC FLIGHT BAG</div>
    </div>

    <div class="home-utility">
      <button class="ghost-link" id="openSettingsBtn">Settings</button>
      <span class="hu-dot">·</span>
      <button class="ghost-link" id="resetWallBtn">Reset wallpaper</button>
    </div>
  </div>

  <!-- APP host (fullscreen). Persistent left icon rail (quick-switch between the most-used
       apps + a Home icon back to the springboard) + a per-app heading/actions row, replacing
       the old single back-button "Jeppesen-style" header -- the rail is built once here
       (buildRail()) and every app inherits it via the shared openApp()/renderApp() path, same
       as the header it replaces. -->
  <div class="app-host hidden" id="appHost">
    <nav class="app-rail" id="appRail"></nav>
    <div class="jep-main">
      <div class="jep-topbar">
        <div class="jep-id">
          <div class="jep-route" id="appRoute"></div>
          <div class="jep-name" id="appName">App</div>
        </div>
        <div class="jep-actions" id="appActions"></div>
      </div>
      <div class="app-body" id="appBody"></div>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
