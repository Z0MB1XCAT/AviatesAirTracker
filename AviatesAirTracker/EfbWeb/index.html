<!DOCTYPE html>
<html lang="en" data-theme="aviates" data-mode="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0A0D17" />
<title>AviatesAir EFB</title>
<link rel="stylesheet" href="efb.css" />
<link rel="stylesheet" href="ui.css" />
<link rel="icon" href="favicon.svg" />
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<!-- ══ PAIRING GATE ══ -->
<div id="pairing" class="pairing hidden">
  <div class="pairing-card">
    <img class="brand-mark-img" src="logo-white.webp" alt="" />
    <h1>AviatesAir <span>EFB</span></h1>
    <p class="pairing-sub">Enter the 6-digit pairing code shown in the desktop app.</p>
    <div class="code-input" id="codeInput">
      <input inputmode="numeric" maxlength="1" /><input inputmode="numeric" maxlength="1" />
      <input inputmode="numeric" maxlength="1" /><input inputmode="numeric" maxlength="1" />
      <input inputmode="numeric" maxlength="1" /><input inputmode="numeric" maxlength="1" />
    </div>
    <p class="pairing-err" id="pairErr"></p>
    <button class="btn-primary" id="pairBtn">Connect Tablet</button>
  </div>
</div>

<!-- ══ DEVICE (its own OS) ══ -->
<div id="app" class="device hidden">

  <!-- OS status bar — transparent, drawn straight over the wallpaper (iPad-style) -->
  <header class="menubar">
    <div class="mb-cluster mb-left">
      <span class="mb-date" id="mbDate">-- --- ----</span>
      <span class="mb-time" id="mbTime">--:--L / --:--Z</span>
    </div>

    <!-- compact live-flight readout, hidden until a session is active -->
    <button class="mb-flight hidden" id="mbFlight" title="Open Flight app">
      <span class="mb-cs" id="mbCs">—</span>
      <span class="mb-phase" id="mbPhase">STANDBY</span>
      <span class="mb-route" id="mbRoute">---- → ----</span>
    </button>

    <div class="mb-cluster mb-right">
      <!-- sterile cockpit: chat alerts are being held (count = held messages) -->
      <span class="mb-fm hidden" id="mbFm" title="Sterile cockpit: chat alerts held">STERILE</span>
      <!-- host link: 4 bars on the live WebSocket, 1 bar while falling back to polling -->
      <span class="mb-ic mb-signal" id="mbSignal" title="Desktop link" data-bars="0">
        <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx=".7"/><rect x="5" y="5.5" width="3" height="6.5" rx=".7"/><rect x="10" y="3" width="3" height="9" rx=".7"/><rect x="15" y="0" width="3" height="12" rx=".7"/></svg>
      </span>
      <span class="mb-ic" id="mbSim" title="Simulator link" data-state="off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>
      </span>
      <span class="mb-ic" id="mbGps" title="Aircraft position" data-state="off">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M21 3 3 10.6l7.4 2.9 2.9 7.5z"/></svg>
      </span>
      <span class="mb-batt-wrap hidden" id="mbBattWrap">
        <span class="mb-pct" id="mbPct"></span>
        <span class="mb-batt"><i id="mbBattFill"></i></span>
      </span>
    </div>
  </header>

  <!-- HOME / launcher -->
  <div class="home" id="home">
    <div class="wallpaper" id="wallpaper"></div>
    <div class="wall-scrim"></div>

    <nav class="app-launcher" id="appGrid" aria-label="Apps"></nav>

    <div class="brand-lockup" id="flightWidget" role="button" tabindex="0" title="Open Flight app">
      <img class="brand-logo" src="logo-wordmark.webp" alt="AviatesAir" />
      <div class="brand-sub">Electronic Flight Bag</div>
    </div>

    <!-- the five apps for the current phase of flight; hidden when there is no flight -->
    <div class="home-dock hidden" id="homeDock" aria-label="Apps for this phase of flight"></div>
    <div class="home-utility">
      <button class="home-btn" id="fullscreenBtn">Enter full screen</button>
      <button class="home-btn" id="wallpaperBtn">Change wallpaper</button>
    </div>
  </div>

  <!-- alert banners (new messages, ACARS uplinks, flight-mode changes) -->
  <div class="nt-stack" id="ntStack" aria-live="polite"></div>
  <!-- APP host (fullscreen, below the status bar). No sidebar: like a real iPad EFB, each app
       owns the whole screen and the home indicator at the bottom (tap or swipe up, or Esc)
       returns to the springboard. Apps in FULL_APPS draw their own chrome; the rest keep the
       slim heading/actions row. -->
  <div class="app-host hidden" id="appHost">
    <div class="jep-main">
      <div class="jep-topbar">
        <div class="jep-id">
          <div class="jep-route" id="appRoute"></div>
          <div class="jep-name" id="appName">App</div>
        </div>
        <div class="jep-actions" id="appActions"></div>
      </div>
      <div class="app-body" id="appBody"></div>
    </div>
    <button class="home-ind" id="homeInd" title="Home (swipe up)" aria-label="Home"><span></span></button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
