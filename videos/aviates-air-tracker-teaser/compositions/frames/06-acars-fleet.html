      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });

          // ================= Furniture (ground / grid / hairlines) =================
          tl.fromTo("#h6-grid", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power3.out" }, 0);
          tl.fromTo(
            "#h6-hairline-top",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.6, ease: "power3.out" },
            0.1
          );
          tl.fromTo(
            "#h6-hairline-bottom",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.6, ease: "power3.out" },
            0.1
          );
          tl.fromTo("#h6-meta-tag", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, 0.3);
          tl.fromTo("#h6-page-num", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, 0.3);
          tl.fromTo(
            "#h6-glitch",
            { opacity: 0 },
            { opacity: 0.4, duration: 0.6, ease: "power3.out" },
            0.4
          );

          // ================= Scene 1 (0.0-1.2s): "BOOK." + booking card =================
          // discrete-text-sequence hard-cut on the clause, center-outward-expansion on the card
          tl.fromTo(
            "#h6-hl-book",
            { opacity: 0 },
            { opacity: 1, duration: 0.01, ease: "none" },
            0.2
          );
          tl.fromTo(
            "#h6-booking-card",
            { opacity: 0, xPercent: 0, x: 40, y: -14, scale: 0.82 },
            { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.62, ease: "power3.out" },
            0.28
          );

          // ================= Scene 2 (1.2-3.0s): "IMPORT YOUR OFP." + SimBrief chip =================
          tl.fromTo(
            "#h6-hl-import",
            { opacity: 0 },
            { opacity: 1, duration: 0.01, ease: "none" },
            1.2
          );
          tl.fromTo(
            "#h6-simbrief-chip",
            { opacity: 0, y: 22, scale: 0.88 },
            { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" },
            1.32
          );

          // svg-path-draw: chip icon strokes on, staggered ~75% of prior segment
          var SB_SEG_DUR = 0.42;
          var sbPaths = ["#h6-sb-path-1", "#h6-sb-path-2", "#h6-sb-path-3"];
          var SB_START = 1.55;
          var SB_STAGGER = SB_SEG_DUR * 0.72;
          sbPaths.forEach(function (sel, i) {
            var el = document.querySelector(sel);
            var len = el.getTotalLength();
            el.style.strokeDasharray = String(len);
            el.style.strokeDashoffset = String(len);
            tl.to(
              sel,
              { strokeDashoffset: 0, duration: SB_SEG_DUR, ease: "power2.out" },
              SB_START + i * SB_STAGGER
            );
          });

          // ================= Scene 3 (3.0-4.8s): "FLY." + fleet strip fans in right-to-left =================
          tl.fromTo(
            "#h6-hl-fly",
            { opacity: 0 },
            { opacity: 1, duration: 0.01, ease: "none" },
            3.0
          );

          var fleetIds = ["#h6-fleet-4", "#h6-fleet-3", "#h6-fleet-2", "#h6-fleet-1"]; // right-to-left order
          var FLEET_START = 3.12;
          var FLEET_STAGGER = 0.16;
          fleetIds.forEach(function (sel, i) {
            tl.fromTo(
              sel,
              { opacity: 0, x: 46, y: 10, scale: 0.9 },
              { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.58, ease: "power3.out" },
              FLEET_START + i * FLEET_STAGGER
            );
          });
          // last card lands ~3.12 + 3*0.16 + 0.58 = 4.18s, settled within the 4.8s Scene 3 window

          // ================= Scene 4 (4.8-6.0s): "ACARS, HANDLED." hard-cuts in =================
          tl.fromTo(
            "#h6-closing-stage",
            { opacity: 0 },
            { opacity: 1, duration: 0.01, ease: "none" },
            4.8
          );

          // subtle jitter across the final hold on the fully assembled set (sine-wave-loop, low amplitude)
          var fleetStripEl = document.getElementById("h6-fleet-strip");
          var jitterPhase = { p: 0 };
          var JITTER_START = 4.9;
          var JITTER_DUR = Math.max(6.0 - JITTER_START, 0.1);
          tl.to(
            jitterPhase,
            {
              p: Math.PI * 2 * (JITTER_DUR / 2.6),
              duration: JITTER_DUR,
              ease: "none",
              onUpdate: function () {
                var y = Math.sin(jitterPhase.p) * 1.6;
                fleetStripEl.style.transform =
                  "translateX(-50%) translateY(" + y.toFixed(2) + "px)";
              },
            },
            JITTER_START
          );

          window.__timelines["06-acars-fleet"] = tl;
        })();
      </script>
