      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });

          // ================= Furniture (ground / grid / hairlines) =================
          tl.fromTo("#h4-grid", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power3.out" }, 0);
          tl.fromTo(
            "#h4-hairline-top",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.6, ease: "power3.out" },
            0.1
          );
          tl.fromTo(
            "#h4-hairline-bottom",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.6, ease: "power3.out" },
            0.1
          );
          tl.fromTo("#h4-meta-tag", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, 0.3);
          tl.fromTo("#h4-page-num", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, 0.3);
          tl.fromTo(
            "#h4-glitch",
            { opacity: 0 },
            { opacity: 0.4, duration: 0.6, ease: "power3.out" },
            0.4
          );

          // ================= Scene 1 (0.0-1.0s): "SIX POINTS. ONE SCORE." =================
          // dynamic-content-sequencing / per-word staggered reveal, centered upper-third
          var hlWords = ["#h4-hw-1", "#h4-hw-2", "#h4-hw-3", "#h4-hw-4"];
          var HL_STAGGER = 0.14;
          hlWords.forEach(function (sel, i) {
            tl.fromTo(
              sel,
              { opacity: 0, y: 16 },
              { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
              0.15 + i * HL_STAGGER
            );
          });

          // ================= Scene 2 (1.0-4.0s): six bars enter + fill, staggered =================
          var barIds = ["#h4-bar-1", "#h4-bar-2", "#h4-bar-3", "#h4-bar-4", "#h4-bar-5", "#h4-bar-6"];
          var fillIds = ["#h4-bf-1", "#h4-bf-2", "#h4-bf-3", "#h4-bf-4", "#h4-bf-5", "#h4-bf-6"];
          var valueIds = ["#h4-bv-1", "#h4-bv-2", "#h4-bv-3", "#h4-bv-4", "#h4-bv-5", "#h4-bv-6"];
          var barScores = [96, 91, 95, 89, 97, 96]; // VS / Pitch / Bank / Speed / Crosswind / Stability
          var BAR_ENTER_START = 1.0;
          var BAR_ENTER_STAGGER = 0.16;
          var BAR_FILL_STAGGER = 0.22;

          // baseline rule draws in first, under the row. fromTo declares xPercent
          // explicitly alongside scaleX so GSAP owns the whole transform string
          // (centering + reveal) with no leftover CSS transform to conflict with.
          tl.fromTo(
            "#h4-bar-baseline",
            { xPercent: -50, scaleX: 0 },
            { xPercent: -50, scaleX: 1, duration: 0.6, ease: "power3.out" },
            BAR_ENTER_START
          );

          barIds.forEach(function (sel, i) {
            tl.fromTo(
              sel,
              { opacity: 0, y: 24 },
              { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
              BAR_ENTER_START + i * BAR_ENTER_STAGGER
            );
          });

          // bars fill one after another (never all at once) — value counts up in lockstep
          var FILL_START = BAR_ENTER_START + barIds.length * BAR_ENTER_STAGGER + 0.1; // ~2.06
          fillIds.forEach(function (sel, i) {
            var startAt = FILL_START + i * BAR_FILL_STAGGER;
            var pct = barScores[i] / 100;
            tl.to(sel, { scaleY: pct, duration: 0.7, ease: "power3.out" }, startAt);

            var counterObj = { v: 0 };
            var valueEl = document.querySelector(valueIds[i]);
            tl.to(
              counterObj,
              {
                v: barScores[i],
                duration: 0.7,
                ease: "power3.out",
                onUpdate: function () {
                  valueEl.textContent = Math.round(counterObj.v);
                },
              },
              startAt
            );
            tl.fromTo(
              valueIds[i],
              { opacity: 0 },
              { opacity: 1, duration: 0.3, ease: "power2.out" },
              startAt
            );
          });
          // last fill lands ~ FILL_START + 5*0.22 + 0.7 = 3.86s, within the 4.0s Scene 2 window

          // ================= Scene 3 (4.0-5.2s): zoom-to-target collapses bars into hero score =================
          // coordinate-target-zoom: outer scales, inner counter-translates so the bar row's
          // visual center (already frame-centered) lands dead-center as it zooms past view;
          // bars fade out while the zoom carries them off, then the score stage cross-fades in.
          var ZOOM_START = 4.0;
          var ZOOM_DUR = 0.75;
          tl.to(
            "#h4-zoom-outer",
            { scale: 2.6, duration: ZOOM_DUR, ease: "power3.inOut" },
            ZOOM_START
          );
          tl.to(
            "#h4-zoom-inner",
            { x: 0, y: 0, duration: ZOOM_DUR, ease: "power3.inOut" },
            ZOOM_START
          );
          tl.to(
            "#h4-zoom-outer",
            { opacity: 0, duration: 0.4, ease: "power2.in" },
            ZOOM_START + 0.25
          );

          // hero score stage fades/scales in as the bar zoom carries past.
          // Centering (translate -50%,-50%) is baked into the SAME raw transform
          // string GSAP writes every frame, so entrance-scale and the later jitter
          // (which also writes this element's transform) never fight the CSS.
          var scoreStageState = { scale: 0.92 };
          var scoreStageEl2 = document.getElementById("h4-score-stage");
          function writeScoreStageTransform(yOffsetPx) {
            var y = yOffsetPx || 0;
            scoreStageEl2.style.transform =
              "translate(-50%, calc(-50% + " + y.toFixed(2) + "px)) scale(" +
              scoreStageState.scale.toFixed(4) + ")";
          }
          writeScoreStageTransform(0);
          var SCORE_IN_START = ZOOM_START + 0.35;
          tl.fromTo(
            "#h4-score-stage",
            { opacity: 0 },
            { opacity: 1, duration: 0.5, ease: "power3.out" },
            SCORE_IN_START
          );
          tl.to(
            scoreStageState,
            {
              scale: 1,
              duration: 0.5,
              ease: "power3.out",
              onUpdate: function () {
                writeScoreStageTransform(0);
              },
            },
            SCORE_IN_START
          );

          // counting-dynamic-scale: score counts up 0 -> 94 with font-size growing
          var scoreEl = document.getElementById("h4-score-num");
          var scoreState = { value: 0, fontSize: 46 };
          var COUNT_START = SCORE_IN_START + 0.05;
          var COUNT_DUR = 0.8;
          tl.to(
            scoreState,
            {
              value: 94,
              fontSize: 132,
              duration: COUNT_DUR,
              ease: "power3.out",
              onUpdate: function () {
                scoreEl.textContent = Math.round(scoreState.value).toLocaleString();
                scoreEl.style.fontSize = scoreState.fontSize.toFixed(1) + "px";
              },
            },
            COUNT_START
          );

          // ambient-glow-bloom behind the hero score, landing on the count-up's settle.
          // Centering is baked into the same raw transform string as the scale tween
          // (never a bare CSS transform + a GSAP `scale` prop on the same element).
          var glowEl = document.getElementById("h4-score-glow");
          function writeGlowTransform(scale) {
            glowEl.style.transform = "translate(-50%, -50%) scale(" + scale.toFixed(4) + ")";
          }
          writeGlowTransform(0.85);
          var GLOW_PEAK_OPACITY = 0.32;
          var BLOOM_START = COUNT_START + COUNT_DUR - 0.15;
          var BLOOM_DUR = 0.55;
          var glowBloomState = { scale: 0.85 };
          tl.fromTo(
            "#h4-score-glow",
            { opacity: 0 },
            { opacity: GLOW_PEAK_OPACITY, duration: BLOOM_DUR, ease: "power2.out" },
            BLOOM_START
          );
          tl.to(
            glowBloomState,
            {
              scale: 1,
              duration: BLOOM_DUR,
              ease: "power2.out",
              onUpdate: function () {
                writeGlowTransform(glowBloomState.scale);
              },
            },
            BLOOM_START
          );
          var glowPhase = { p: 0 };
          var BREATHE_START = BLOOM_START + BLOOM_DUR; // ~5.1
          var BREATHE_DUR = Math.max(6.0 - BREATHE_START, 0.1);
          tl.to(
            glowPhase,
            {
              p: Math.PI * 2 * 0.35,
              duration: BREATHE_DUR,
              ease: "none",
              onUpdate: function () {
                var s = Math.sin(glowPhase.p);
                glowEl.style.opacity = String(GLOW_PEAK_OPACITY + s * 0.03);
                glowEl.style.transform =
                  "translate(-50%, -50%) scale(" + (1 + s * 0.015).toFixed(4) + ")";
              },
            },
            BREATHE_START
          );

          // ================= Scene 4 (5.2-6.0s): "HOW GOOD WAS THAT LANDING?" hard-cut =================
          // discrete-text-sequence: instant hard cut, no transition, beneath the score
          tl.fromTo(
            "#h4-closing-stage",
            { opacity: 0 },
            { opacity: 1, duration: 0.01, ease: "none" },
            5.2
          );

          // subtle jitter on the settled score through the final hold (sine-wave-loop, low
          // amplitude). Reuses writeScoreStageTransform so the settled scale (1) from the
          // entrance tween is preserved — jitter only adds a y offset, never clobbers scale.
          var jitterPhase = { p: 0 };
          tl.to(
            jitterPhase,
            {
              p: Math.PI * 2 * 0.5,
              duration: 0.8,
              ease: "none",
              onUpdate: function () {
                var y = Math.sin(jitterPhase.p) * 1.4;
                writeScoreStageTransform(y);
              },
            },
            5.2
          );

          window.__timelines["04-landing-analysis"] = tl;
        })();
      </script>
