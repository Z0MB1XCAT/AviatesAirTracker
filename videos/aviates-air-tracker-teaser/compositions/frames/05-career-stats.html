        .rank-tag {

      </style>

      <div id="root" data-composition-id="05-career-stats" data-width="1920" data-height="1080">

            ><span class="word">EVERY</span><span class="word">HOUR</span><span class="word"
              >COUNTS.</span

        <div class="burst-wrap clip" id="h5-burst-wrap" data-start="0" data-duration="5" data-track-index="8">
          <div class="stat-card" id="h5-card-flights" data-target-x="-24cqw" data-target-y="0">
            <div class="stat-tick" id="h5-tick-flights"></div>

              <span class="stat-value" id="h5-val-flights">0</span>

            <div class="stat-tick" id="h5-tick-hours"></div>
            <div class="stat-value-row">
              <span class="stat-value" id="h5-val-hours">0</span>
              <span class="stat-suffix">HRS</span>
            </div>
            <span class="stat-label">Hours</span>
          </div>
          <div class="stat-card" id="h5-card-landings" data-target-x="24cqw" data-target-y="0">
            <div class="stat-tick" id="h5-tick-landings"></div>

        <div class="rank-wrap clip" id="h5-rank-wrap" data-start="0" data-duration="5" data-track-index="9">
          <div class="rank-badge" id="h5-rank-badge">
            <div class="rank-glow" id="h5-rank-glow"></div>
            <svg width="42%" height="42%" viewBox="0 0 40 40" style="position: relative; z-index: 1;">
              <path d="M20 4 L24 16 L36 16 L26 23 L30 35 L20 27 L10 35 L14 23 L4 16 L16 16 Z" fill="#3b82f6" />
            </svg>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });

          // ---- furniture: grid, hairlines, chrome, glitch (0.0-0.5s) ----
          tl.fromTo("#h5-hairline-top", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
          tl.fromTo(
            "#h5-hairline-bottom",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.5, ease: "power3.out" },
            0
          );
          tl.fromTo("#h5-meta-tag", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power3.out" }, 0.15);
          tl.fromTo("#h5-page-num", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power3.out" }, 0.15);
          tl.fromTo("#h5-glitch", { opacity: 0 }, { opacity: 0.5, duration: 0.5, ease: "power3.out" }, 0.2);

          // ---- Scene 1 (0.0-1.2s): "EVERY HOUR COUNTS." per-word staggered reveal ----
          tl.fromTo(
            "#h5-headline .word",
            { opacity: 0, y: "0.5cqw" },
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.16 },
            0.15
          );

          // ---- Scene 2 (1.2-3.0s): three stat cards center-outward-expansion into a row ----
          var cards = document.querySelectorAll(".stat-card");
          var EXPAND_DUR = 1.0;
          var STAGGER = 0.06;
          cards.forEach(function (el, i) {
            var tx = el.getAttribute("data-target-x");
            var ty = el.getAttribute("data-target-y");
            tl.fromTo(
              el,
              { x: 0, y: 0, scale: 0.55, opacity: 0 },
              {
                x: tx,
                y: ty,
                scale: 1,
                opacity: 1,
                duration: EXPAND_DUR,
                ease: "power3.out",
              },
              1.2 + i * STAGGER
            );
          });

          // stat counters — staggered value-scaled counters, one after another
          function countUp(id, target, startAt, dur, suffix) {
            var state = { v: 0 };
            tl.to(
              state,
              {
                v: target,
                duration: dur,
                ease: "power3.out",
                onUpdate: function () {
                  document.getElementById(id).textContent = Math.round(state.v).toLocaleString();
                },
              },
              startAt
            );
          }
          countUp("h5-val-flights", 214, 1.5, 1.0);
          countUp("h5-val-hours", 1842, 1.68, 1.0);
          countUp("h5-val-landings", 189, 1.86, 1.0);

          // baseline ticks under each card, chorded with the counters
          tl.fromTo("#h5-tick-flights", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, 1.5);
          tl.fromTo("#h5-tick-hours", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, 1.68);
          tl.fromTo("#h5-tick-landings", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, 1.86);

          // ---- Scene 3 (3.0-4.2s): rank badge enters, steps through tiers, lands on CAPTAIN ----
          tl.fromTo(
            "#h5-rank-wrap",
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            3.0
          );

          // discrete-text-sequence: rank tier steps through in order
          var TIERS = [
            "CADET",
            "JR. FIRST OFFICER",
            "FIRST OFFICER",
            "SR. FIRST OFFICER",
            "JR. CAPTAIN",
            "CAPTAIN",
          ];
          var tierEl = document.getElementById("h5-rank-tier");
          var TIER_START = 3.05;
          var TIER_STEP = 0.16;
          var tierSequence = TIERS.map(function (text, i) {
            return { t: TIER_START + i * TIER_STEP, text: text };
          });
          function tierAt(time) {
            for (var i = tierSequence.length - 1; i >= 0; i--) {
              if (time >= tierSequence[i].t) return tierSequence[i].text;
            }
            return tierSequence[0].text;
          }
          var tierDriver = { t: 0 };
          var lastTier = "";
          tl.to(
            tierDriver,
            {
              t: 5.0,
              duration: 5.0,
              ease: "none",
              onUpdate: function () {
                var text = tierAt(tierDriver.t);
                if (text !== lastTier) {
                  tierEl.textContent = text;
                  lastTier = text;
                }
              },
            },
            0
          );

          // badge glow blooms as CAPTAIN lands
          var captainAt = TIER_START + (TIERS.length - 1) * TIER_STEP;
          tl.fromTo(
            "#h5-rank-glow",
            { opacity: 0 },
            { opacity: 1, duration: 0.5, ease: "power2.out" },
            captainAt
          );

          // "CADET TO CAPTAIN." hard-cuts in beside the badge as it lands
          tl.set("#h5-cadet-to-captain", { opacity: 1 }, captainAt);

          // ---- Scene 4 (4.2-5.0s): hold on settled stat row + rank badge; subtle jitter only ----
          var jitterPhase = { p: 0 };
          tl.to(
            jitterPhase,
            {
              p: Math.PI * 2 * 0.8,
              duration: 0.8,
              ease: "none",
              onUpdate: function () {
                var v = Math.sin(jitterPhase.p) * 0.4;
                document.getElementById("h5-rank-glow").style.opacity = String(0.85 + v * 0.15);
              },
            },
            4.2
          );

          window.__timelines["05-career-stats"] = tl;
        })();
      </script>
